# Generates the Web Push (VAPID) key pair on GitHub's servers and stores it
# directly in Supabase Edge Function secrets. The private key is masked and
# never printed; only the public key is shown (in the run summary) because
# Vercel needs it as VITE_VAPID_PUBLIC_KEY.
#
# Run from: GitHub → Actions → "Supabase: set up push keys" → Run workflow.
# Requires the repository secret SUPABASE_ACCESS_TOKEN.
name: "Supabase: set up push keys"

on:
  workflow_dispatch:
    inputs:
      contact_email:
        description: Your email (push services use it as a contact; not shown to users)
        required: true
        type: string
      replace_existing:
        description: Replace keys that already exist (every device must turn reminders on again)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  push-keys:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qrgbfxrzypqtckfdfkil
    steps:
      - name: Check Supabase access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN first (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Look for existing keys
        id: existing
        run: |
          secrets=$(supabase secrets list --project-ref "$PROJECT_REF")
          if echo "$secrets" | grep -qw VAPID_PRIVATE_KEY; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate keys and save them to Supabase
        if: steps.existing.outputs.exists == 'false' || inputs.replace_existing
        env:
          CONTACT_EMAIL: ${{ inputs.contact_email }}
        run: |
          keys=$(npx --yes web-push@3.6.7 generate-vapid-keys --json)
          public_key=$(echo "$keys" | jq -r .publicKey)
          private_key=$(echo "$keys" | jq -r .privateKey)
          echo "::add-mask::$private_key"

          supabase secrets set --project-ref "$PROJECT_REF" \
            "VAPID_PUBLIC_KEY=$public_key" \
            "VAPID_PRIVATE_KEY=$private_key" \
            "VAPID_SUBJECT=mailto:$CONTACT_EMAIL"

          {
            echo "## ✅ Push keys saved to Supabase"
            echo
            echo "Add this value in **Vercel → Settings → Environment Variables** as \`VITE_VAPID_PUBLIC_KEY\`:"
            echo
            echo '```'
            echo "$public_key"
            echo '```'
            echo
            echo "The private key went straight into Supabase secrets and is not shown anywhere."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keys already exist
        if: steps.existing.outputs.exists == 'true' && !inputs.replace_existing
        run: |
          msg="Push keys already exist in Supabase, so nothing was changed. If you no longer have the public key, run this workflow again with 'Replace keys that already exist' ticked."
          echo "::warning::$msg"
          echo "## ℹ️ $msg" >> "$GITHUB_STEP_SUMMARY"
